name: Ejecutar Devocional Diario

on:
    schedule:
        # Se ejecuta todos los días a las 14:00 UTC (10:00 AM hora de Venezuela / UTC-4)
        - cron: "0 14 * * *"
    workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras probarlo

jobs:
    run-bot:
        runs-on: ubuntu-latest
        steps:
            - name: Copiar código del repositorio
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Instalar dependencias
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Ejecutar script de devocionales
              env:
                  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
                  CHAT_ID: ${{ secrets.CHAT_ID }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
              run: |
                  python devocional.py
