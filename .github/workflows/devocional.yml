name: Ejecutar Devocional Diario

# Permiso explícito de escritura para guardar procesados.json
permissions:
  contents: write

on:
  schedule:
    # Intenta a las 10:00 AM, 12:00 PM, 2:00 PM y 4:00 PM (Hora Venezuela)
    # (14:00, 16:00, 18:00 y 20:00 UTC)
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: TELEGRAM_TOKEN # Indica que use los secretos de ese entorno
    steps:
      - name: Copiar código del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de devocionales
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python devocional.py

      - name: Persistir historial de devocionales
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add procesados.json
          git commit -m "chore: actualizar historial de devocional enviado [skip ci]" || exit 0
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:refs/heads/${{ github.ref_name || 'main' }}
